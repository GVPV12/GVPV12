name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

# Sin permisos por defecto: cada job pide solo lo que necesita.
permissions: {}

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar la animación de la snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF00FF&color_dots=#0D0221,#7B2CBF,#C724B1,#FF00FF,#00FFFF
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00FFFF&color_dots=#0D0221,#7B2CBF,#C724B1,#FF00FF,#00FFFF

      - name: Publicar en la rama "output"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # snk corre en Docker y deja dist/ como root: hay que tomar posesión.
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update contribution snake"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
